<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi 板子</title>
<script src="/hub.js"></script>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --line: #e4e3dc; --line-strong: #d3d2c9;
  --text: #1f1f1c; --muted: #6d6c64; --faint: #9c9b92;
  --accent: #3d5afe; --accent-soft: #e8ecff; --accent-text: #2a3fc2;
  --ok: #2e9d6a; --warn: #b67c0e; --warn-soft: #fbf1dc; --danger: #d4453b; --danger-soft: #fbe7e5;
  --select: #d9e0ff; --mark: #f1f0ea;
  --r: 10px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --s1: #3d5afe; --s2: #e0663a; --s3: #2e9d6a; --s4: #a24bd6; --s5: #c98a12; --s6: #1b9ab8; --s7: #d4453b; --s8: #6d6c64;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1e1e1c; --line: #2c2c29; --line-strong: #3a3a36;
    --text: #ecebe6; --muted: #a09f97; --faint: #6f6e67;
    --accent: #7b8cff; --accent-soft: #262b4a; --accent-text: #aab6ff;
    --ok: #4cc38a; --warn: #e0a83a; --warn-soft: #3a2f16; --danger: #f07167; --danger-soft: #3d2220;
    --select: #262b4a; --mark: #262624;
    --s1: #7b8cff; --s2: #f08a5d; --s3: #4cc38a; --s4: #c48bf0; --s5: #e0a83a; --s6: #4fc3dc; --s7: #f07167; --s8: #a09f97;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1e1e1c; --line: #2c2c29; --line-strong: #3a3a36;
  --text: #ecebe6; --muted: #a09f97; --faint: #6f6e67;
  --accent: #7b8cff; --accent-soft: #262b4a; --accent-text: #aab6ff;
  --ok: #4cc38a; --warn: #e0a83a; --warn-soft: #3a2f16; --danger: #f07167; --danger-soft: #3d2220;
  --select: #262b4a; --mark: #262624;
  --s1: #7b8cff; --s2: #f08a5d; --s3: #4cc38a; --s4: #c48bf0; --s5: #e0a83a; --s6: #4fc3dc; --s7: #f07167; --s8: #a09f97;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); display: flex; flex-direction: column; }
header { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.brand { font-weight: 650; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.pi-web-multi .brand-name { display: none; }
.brand .logo { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; }
#pi-web-nav { min-width: 0; overflow-x: auto; }
.status { display: flex; align-items: center; gap: 8px; min-width: 0; margin-left: auto; justify-content: flex-end; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.open { background: var(--ok); } .dot.waiting { background: var(--warn); } .dot.paused { background: var(--accent); }
.status .port { font-family: var(--mono); font-size: 13px; }
.status .meta { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status .meta.stale { color: var(--warn); }
button { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 7px; padding: 5px 11px; cursor: pointer; }
button:hover { border-color: var(--accent); color: var(--accent-text); }
button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
input[type=search], input[type=text] { font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 7px; padding: 5px 9px; min-width: 0; }
input[type=search] { width: 180px; }
select { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 7px; padding: 4px 6px; max-width: 220px; }
#portSel { font-family: var(--mono); font-size: 12px; }
#garbled { display: none; padding: 8px 16px; background: var(--warn-soft); color: var(--text); font-size: 13px; border-bottom: 1px solid var(--line); }
#garbled.show { display: block; }
#garbled button { margin-left: 6px; padding: 2px 8px; font-size: 12px; }
main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#plotWrap { border-bottom: 1px solid var(--line); background: var(--panel); padding: 8px 16px 6px; }
#plotWrap.hidden { display: none; }
#plotTop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
#legend { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.series { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-family: var(--mono); color: var(--text); background: none; font-size: 12px; }
.series.off { opacity: .4; }
.series i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.series b { font-weight: 500; color: var(--muted); }
#plot { width: 100%; height: 200px; display: block; cursor: crosshair; }
#plotEmpty { color: var(--faint); font-size: 13px; padding: 30px 0; text-align: center; }
#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 8px; font: 12px var(--mono); display: none; z-index: 5; }
#log { flex: 1; overflow: auto; font: 12.5px/1.5 var(--mono); padding: 6px 0 70px; background: var(--panel); }
.row { display: flex; gap: 12px; padding: 0 16px; white-space: pre-wrap; word-break: break-word; cursor: default; }
.row:hover { background: var(--bg); }
.row .t { color: var(--faint); flex: none; user-select: none; }
.row.sel { background: var(--select); box-shadow: inset 3px 0 0 var(--accent); }
.row.sel:hover { background: var(--select); }
#log.picking .row { user-select: none; cursor: pointer; }
#log .row { cursor: pointer; }
#drawer { position: fixed; top: 0; right: 0; width: min(460px, 100%); height: 100%; background: var(--panel); border-left: 1px solid var(--line-strong); box-shadow: -8px 0 30px rgba(0,0,0,.10); z-index: 15; display: flex; flex-direction: column; }
#drawer[hidden] { display: none; }
#drawer .dhead { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 15px; }
#drawer .dhead button { border: 0; background: none; font-size: 16px; color: var(--muted); }
#drawer .dbody { overflow: auto; padding: 14px 18px 40px; }
.dpick { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
.dpick select { flex: 1; max-width: none; }
.dpick[hidden] { display: none; }
#dContent h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 8px; font-weight: 600; }
#dContent .card { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
#dContent .card .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
#dContent .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13px; }
#dContent .kv code, #dContent .mono { font-family: var(--mono); font-size: 12px; }
#dContent .src { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); margin-left: 6px; white-space: nowrap; }
#dContent .src.measured { border-color: var(--ok); color: var(--ok); }
#dContent .quirk { background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 13px; }
#dContent .verdict { font-family: var(--mono); font-size: 12px; font-weight: 600; margin-right: 6px; }
#dContent .verdict.pass { color: var(--ok); }
#dContent .verdict.fail { color: var(--warn); }
#dContent .crit { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 2px 0 0 18px; overflow-wrap: anywhere; }
#dContent table.exp { font-size: 12px; margin-top: 8px; border-collapse: collapse; }
#dContent table.exp th, #dContent table.exp td { text-align: left; padding: 3px 14px 3px 0; border-bottom: 1px solid var(--line); }
#dContent table.exp th { color: var(--muted); font-weight: 500; }
#dContent .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); margin-left: 6px; }
#dContent .badge.ok { border-color: var(--ok); color: var(--ok); }
#dContent .badge.warn { border-color: var(--warn); color: var(--warn); }
#dContent .hint { color: var(--muted); font-size: 13px; line-height: 1.6; }
#dContent a { color: var(--accent-text); }
#dContent .doc { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
#dContent details { border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 13px; }
#dContent details summary { cursor: pointer; }
#dContent .note { font-size: 13px; line-height: 1.55; padding: 6px 2px; }
#dContent .note pre { background: var(--bg); padding: 8px; border-radius: 6px; overflow: auto; font: 12px var(--mono); }
#dContent .note table { border-collapse: collapse; font-size: 12px; margin: 6px 0; }
#dContent .note td, #dContent .note th { border: 1px solid var(--line); padding: 3px 6px; vertical-align: top; }
#latest { position: fixed; right: 24px; bottom: 76px; display: none; z-index: 4; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
#latest.show { display: block; }
.row.E .x { color: var(--danger); } .row.W .x { color: var(--warn); } .row.D .x, .row.V .x { color: var(--faint); }
.row.crash { background: var(--danger-soft); }
.row.mark { color: var(--muted); background: var(--mark); margin: 4px 0; font-family: var(--sans); font-size: 12px; }
.row.mark .x::before { content: "── "; } .row.mark .x::after { content: " ──"; }
.row.decoded { background: var(--warn-soft); }
.row.hide { display: none; }
#empty { color: var(--faint); text-align: center; padding: 60px 16px; font-family: var(--sans); }
#askBar { position: fixed; left: 16px; right: 16px; bottom: 14px; display: none; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 8px 10px; box-shadow: 0 4px 24px rgba(0,0,0,.12); }
#askBar.show { display: flex; }
#askBar .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
#askBar input { flex: 1; }
#toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 8px; font-size: 13px; display: none; z-index: 10; max-width: calc(100% - 32px); }
@media (max-width: 640px) {
  header { padding: 8px 12px; } input[type=search] { width: 100%; flex: 1 1 100%; }
  .row { padding: 0 12px; } .row .t { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="logo">π</span><span class="brand-name" id="brandName"></span></div>
    <nav id="pi-web-nav"></nav>
  <div class="status"><span class="dot" id="dot"></span><span class="port" id="port">…</span><span class="meta" id="meta"></span></div>
  </div>
  <div class="bar controls">
  <select id="portSel" title=""></select>
  <select id="baudSel" title=""></select>
  <input type="search" id="filter">
  <button id="follow" class="on"></button>
  <button id="plotBtn" class="on"></button>
  <button id="pause"></button>
  <button id="reset"></button>
  <button id="recover"></button>
  <button id="clear"></button>
  <button id="boardBtn"></button>
  <button id="labBtn"></button>
  </div>
</header>
<div id="garbled"></div>
<main>
  <div id="plotWrap">
    <div id="plotTop"><div id="legend"></div><span id="windowLabel"></span>
      <select id="window"><option value="30">30 s</option><option value="60" selected>60 s</option><option value="300">5 min</option><option value="0">∞</option></select>
    </div>
    <canvas id="plot"></canvas>
    <div id="plotEmpty"></div>
  </div>
  <div id="log"><div id="empty"></div></div>
</main>
<div id="askBar"><span class="count" id="selCount"></span><input type="text" id="question"><button id="copy"></button><button class="primary" id="ask"></button></div>
<aside id="drawer" hidden>
  <div class="dhead"><b id="dTitle"></b><button id="dClose">✕</button></div>
  <div class="dbody">
    <label class="dpick"><span id="dPickLabel"></span><select id="boardSel"></select></label>
    <div id="dContent"></div>
  </div>
</aside>
<button id="latest"></button>
<div id="tip"></div>
<div id="toast"></div>
<script>
"use strict";
const T = {
  zh: { title: "pi 板子", brand: "板子", filter: "过滤日志…", follow: "自动滚动", plot: "曲线", pause: "释放串口", resume: "取回串口", reset: "复位板子", recover: "恢复 USB", recoverTip: "板子没反应时：用软件拔插一次 USB", recovered: "USB 已重新连接", clear: "清空",
    empty: "等板子输出…（打开这个页面时，pi 会接管串口；点「释放串口」可以让其他程序使用）", noBoard: "没有找到板子：请插上 USB 线",
    plotEmpty: "日志里出现 名称=数值（例如 fps=50、temp: 21.5）时，这里会画出曲线", selected: n => `已选 ${n} 行`, latest: "↓ 回到最新", pickTip: "按住拖动可选多行，Shift 点击选一段，⌘ 点击加选",
    question: "想问什么？（留空：这是什么意思，有问题就找原因）", ask: "问 pi", copy: "复制", copied: "已复制", asked: "已发给 pi，回到终端看回答",
    states: { open: "已连接", waiting: "等待板子…", released: "串口已释放", paused: "已释放给其他程序", stopped: "未连接", "no-board": "没有板子" },
    board: "板卡", boardTitle: "板卡包", pickBoard: "这个项目的板子", noBoard: "（不用板卡包）", connectedMark: " · 已连接的设备匹配",
    boardIntro: "选定板子后，pi 会知道它的引脚、总线上的器件和已知的坑；芯片手册和验证过的经验笔记会给 agent 查阅（装了 pi-kb 时导入知识库）。",
    boardSuggest: n => `插着的设备看起来是 ${n}，可以在上面选它。`, chip: "芯片", buses: "总线和器件", pins: "引脚", buttons: "按键", quirks: "已知的坑",
    docs: "芯片手册和经验笔记", openPdf: "打开 PDF", notDownloaded: "选定后自动下载", vendorDocs: "厂商文档", inKb: n => `在知识库中搜索「${n}」`,
    measured: "实测", srcNames: { m5docs: "M5Stack 文档", m5unified: "M5Unified 驱动" }, contentLang: "板卡包内容为英文。",
    portAuto: "串口：自动", portTip: "看哪个串口（拔插后名字可能会变，选「自动」最省心）", baudTip: "波特率：要和程序里设置的一致。ESP32-S3/C3 的原生 USB 不受影响", baud: n => `${n} 波特`,
    garbled: b => `收到的内容大部分是乱码：波特率（${b}）可能和程序里设置的不一致。试试：`,
    firmware: { never: "本次会话还没烧录", synced: "固件与代码一致", stale: "⚠ 板子上的固件不是最新代码" }, window: "时间窗",
    lab: "实验", labTitle: "实验与验收", lastChecks: "最近一次验收", checksMeta: (p, n) => `验收 ${p}/${n}`, noChecks: "还没有跑过验收检查。和 agent 约定好「修好」的标准后，用 board_check 保存（save=true），之后每次可以跑。",
    experiments: "对照实验", noExperiments: "还没有实验。agent 遇到意外结果、或者有两种解释时，会用 board_experiment 做对照实验，表格会出现在这里。",
    settled: "结论一致", unsettled: "结果不一致", variant: "变体", matched: "匹配", consistent: "一致", yes: "是", no: "否",
    notes: "经验笔记", status: { measured: "已实测", "needs-review": "需要复核" }, ranAt: "运行于" },
  en: { title: "pi Board", brand: "Board", filter: "Filter the log…", follow: "Follow", plot: "Plot", pause: "Release port", resume: "Take port back", reset: "Reset board", recover: "Recover USB", recoverTip: "When the board stops answering: a software unplug and replug", recovered: "USB re-enumerated", clear: "Clear",
    empty: "Waiting for the board… (pi holds the serial port while this page is open; Release port lets other programs use it)", noBoard: "No board found: plug in its USB cable",
    plotEmpty: "When the log prints name=value pairs (fps=50, temp: 21.5), they are plotted here", selected: n => `${n} line${n > 1 ? "s" : ""} selected`, latest: "↓ Latest", pickTip: "Drag to select several lines, Shift-click for a range, ⌘-click to add",
    question: "Your question (empty: what does this mean, and find the cause if it is a problem)", ask: "Ask pi", copy: "Copy", copied: "Copied", asked: "Sent to pi; the answer is in the terminal",
    states: { open: "connected", waiting: "waiting for the board…", released: "port released", paused: "released to other programs", stopped: "not connected", "no-board": "no board" },
    board: "Board pack", boardTitle: "Board pack", pickBoard: "This project's board", noBoard: "(no board pack)", connectedMark: " · matches a connected device",
    boardIntro: "With a board chosen, pi knows its pins, the devices on its buses and its known quirks; its datasheets and verified notes are there for the agent to look up (imported into pi-kb when installed).",
    boardSuggest: n => `The connected device looks like a ${n}; you can choose it above.`, chip: "Chip", buses: "Buses and devices", pins: "Pins", buttons: "Buttons", quirks: "Known quirks",
    docs: "Datasheets and notes", openPdf: "Open PDF", notDownloaded: "downloaded once chosen", vendorDocs: "vendor docs", inKb: n => `Search "${n}" in the knowledge base`,
    measured: "measured", srcNames: { m5docs: "M5Stack docs", m5unified: "M5Unified driver" }, contentLang: "",
    portAuto: "Port: auto", portTip: "Which serial port to watch (names can change when you replug; auto is simplest)", baudTip: "Baud rate: must match the firmware's. Native USB on the ESP32-S3/C3 ignores it", baud: n => `${n} baud`,
    garbled: b => `Most of what arrives is unreadable: the baud rate (${b}) probably does not match the firmware's. Try:`,
    firmware: { never: "not flashed in this session", synced: "firmware matches the code", stale: "⚠ the board runs older firmware than the code" }, window: "window",
    lab: "Experiments", labTitle: "Experiments and checks", lastChecks: "Last board checks", checksMeta: (p, n) => `checks ${p}/${n}`, noChecks: "No board checks have run yet. Agree with the agent on what \"fixed\" means and save it with board_check (save=true); then run them any time.",
    experiments: "Experiments", noExperiments: "No experiments yet. When a result surprises the agent, or two explanations fit, it runs one with board_experiment and the table shows up here.",
    settled: "settled", unsettled: "not settled", variant: "Variant", matched: "Matched", consistent: "Consistent", yes: "yes", no: "no",
    notes: "Notes", status: { measured: "measured", "needs-review": "needs review" }, ranAt: "ran" },
};
const web = window.piWeb || { token: new URLSearchParams(location.hash.slice(1)).get("token"), lang: "zh" };
const t = T[web.lang] || T.en;
document.title = t.title;
const $ = id => document.getElementById(id);
const api = async (path, body) => {
  const r = await fetch(`/api/lab${path}`, body === undefined ? { headers: { "x-token": web.token } }
    : { method: "POST", headers: { "x-token": web.token, "content-type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { status: r.status });
  return data;
};
const toast = msg => { const el = $("toast"); el.textContent = msg; el.style.display = "block"; clearTimeout(toast.timer); toast.timer = setTimeout(() => el.style.display = "none", 2600); };

for (const [id, key] of [["follow", "follow"], ["plotBtn", "plot"], ["reset", "reset"], ["recover", "recover"], ["clear", "clear"], ["ask", "ask"], ["copy", "copy"]]) $(id).textContent = t[key];
$("recover").title = t.recoverTip;
$("brandName").textContent = t.brand;
$("filter").placeholder = t.filter; $("question").placeholder = t.question; $("empty").textContent = t.empty; $("plotEmpty").textContent = t.plotEmpty;
$("windowLabel").textContent = t.window;

// ---- log ----
const MAX_ROWS = 6000;
const log = $("log");
const rows = new Map();          // n -> row element
const lines = new Map();         // n -> line
let last = 0, follow = true, filter = "", anchor = null, paused = false;
const selected = new Set();
const time = ts => new Date(ts).toTimeString().slice(0, 8) + "." + String(ts % 1000).padStart(3, "0");
const LEVEL = /^([EWIDV]) \(\d+\)/;
const CRASH = /Guru Meditation|abort\(\) was called|Backtrace:|panic|assert failed|Stack smashing|HardFault|stack overflow/i;

function addRow(line) {
  $("empty").style.display = "none";
  const row = document.createElement("div");
  row.className = "row";
  if (line.kind === "mark") row.classList.add("mark");

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function markdown(text) {

  for (const e of lab.experiments) {
    const rows = e.rows.map(r => `<tr><td>${esc(r.name)}</td><td class="mono">${r.matched}/${r.judged}${r.runs > r.judged ? ` (+${r.runs - r.judged})` : ""}</td><td>${r.consistent ? t.yes : t.no}</td></tr>`).join("");
    html.push(`<div class="card"><b>${esc(e.id)}</b> ${esc(e.question)}<span class="badge ${e.settled ? "ok" : "warn"}">${e.settled ? t.settled : t.unsettled}</span>` +
      `<div class="sub">${t.ranAt} ${esc(new Date(e.at).toLocaleString())}${e.env.board ? ` · ${esc(e.env.board)}` : ""} · <span class="mono">/${esc(e.measure)}/</span></div>` +
      `<table class="exp"><tr><th>${t.variant}</th><th>${t.matched}</th><th>${t.consistent}</th></tr>${rows}</table></div>`);
  }
  if (lab.notes.length) {
    html.push(`<h3>${t.notes}</h3>`);
    for (const n of lab.notes) {
      const st = t.status[n.status] ?? n.status;
      html.push(`<details data-lab-note="${esc(n.file)}"><summary>📝 ${esc(n.title)}<span class="badge ${n.status === "needs-review" ? "warn" : "ok"}">${esc(st)}</span></summary><div class="note">…</div></details>`);
    }
  }
  $("dContent").innerHTML = html.join("");
}
$("dContent").addEventListener("toggle", async e => {
  const d = e.target; if (!d.open || !d.dataset.labNote || d.dataset.loaded) return;
  d.dataset.loaded = "1";
  try { const r = await api(`/lab/note?file=${encodeURIComponent(d.dataset.labNote)}`); d.querySelector(".note").innerHTML = markdown(r.text.replace(/```pi-lab-experiment[\s\S]*?```/, "")); }
  catch (err) { d.querySelector(".note").textContent = err.message; }
}, true);

// ---- status and controls ----
function showState(state) {
  paused = state === "paused";
  $("dot").className = "dot " + (state === "open" ? "open" : state === "paused" ? "paused" : state === "waiting" ? "waiting" : "");
  $("pause").textContent = paused ? t.resume : t.pause;
  $("pause").classList.toggle("on", paused);
  $("reset").disabled = paused || state === "no-board";
}
async function status() {
  try {
    const s = await api("/state");
    $("port").textContent = s.port ? `${s.port}` : "—";
    showSerial(s);
    showState(s.state);
    const parts = [t.states[s.state] || s.state];
    if (s.board) parts.push(s.board);
    const stale = s.firmware === "stale";
    if (t.firmware[s.firmware]) parts.push(t.firmware[s.firmware]);
    const failing = s.checks && s.checks.passed < s.checks.total;
    if (s.checks) parts.push(t.checksMeta(s.checks.passed, s.checks.total) + (failing ? " ✗" : " ✓"));
    $("meta").textContent = parts.join(" · ");
    $("meta").classList.toggle("stale", stale || !!failing);
    if (s.state === "no-board") $("empty").textContent = t.noBoard;
  } catch {}
}
$("reset").onclick = async () => { try { await api("/reset", {}); } catch (err) { toast(err.message); } };
$("recover").onclick = async () => { try { const r = await api("/recover", {}); toast(/re-enumerated/.test(r.result) ? t.recovered : r.result); } catch (err) { toast(err.message); } };
$("pause").onclick = async () => { try { await api(paused ? "/resume" : "/pause", {}); await status(); } catch (err) { toast(err.message); } };

// ---- live lines: long polling ----
async function poll() {
  for (;;) {
    try {
      const r = await api(`/lines?since=${last}${last ? "&wait=1" : ""}`);
      for (const line of r.lines) { addRow(line); collect(line); last = Math.max(last, line.n); }
      if (r.lines.length) scrollDown();
      if (plotDirty) redraw();
      if (r.lines.length) checkGarbled();
      showState(r.state);
    } catch (err) {
      if (err.status === 401) { $("empty").textContent = err.message; $("empty").style.display = "block"; return; }
      if (err.status === 404) { showState("no-board"); $("empty").textContent = t.noBoard; }
      await new Promise(r => setTimeout(r, 2000));
    }
  }
}
status(); setInterval(status, 4000);
poll();
</script>
