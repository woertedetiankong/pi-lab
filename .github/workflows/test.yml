name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The board tools need /dev serial ports and bash: macOS and Linux. Windows is not supported yet.
        os: [ubuntu-latest, macos-latest]
        # 22: the oldest pi-lab supports (package.json engines, 22.19+ runs the TypeScript directly); 24: current.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
      - run: npm test
